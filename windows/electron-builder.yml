appId: com.flik.connector
productName: Flik Connector
electronVersion: 31.3.1
publish:
  provider: github
  owner: ashoka-2
  repo: Flik
  releaseType: release
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
